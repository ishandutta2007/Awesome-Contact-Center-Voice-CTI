<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanPulse" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".8"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="lightGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseAnim{0%{transform:scale(.96);opacity:.35}}@keyframes waveAnim{0%{transform:translateY(0) scaleY(.9)}50%{transform:translateY(-8px) scaleY(1.1)}}@keyframes floatAnim{0%{transform:translateY(0)}}.bg-grid{stroke:#334155;stroke-opacity:.18;stroke-width:1}.pulse-circle{animation:pulseAnim 4s ease-in-out infinite alternate}.wave-line{animation:waveAnim 6s ease-in-out infinite alternate}.orbit-node{animation:floatAnim 5s ease-in-out infinite alternate}.signal-beam{stroke-dasharray:8 12;animation:dashAnim 25s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}