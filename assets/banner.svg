<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    .pulse-circle { animation: pulseAnim 4s ease-in-out infinite alternate; }
    .wave-line { animation: waveAnim 6s ease-in-out infinite alternate; }
    .orbit-node { animation: floatAnim 5s ease-in-out infinite alternate; }
    .signal-beam { stroke-dasharray: 8 12; animation: dashAnim 25s linear infinite; }
    
    @keyframes pulseAnim {
      0% { transform: scale(0.96); opacity: 0.35; }
      100% { transform: scale(1.08); opacity: 0.75; }
    }
    @keyframes waveAnim {
      0% { transform: translateY(0px) scaleY(0.9); }
      50% { transform: translateY(-8px) scaleY(1.1); }
      100% { transform: translateY(3px) scaleY(0.95); }
    }
    @keyframes dashAnim {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Background -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic / Animated Background Waveforms & Nodes (Behind Foreground Content) -->
  <g opacity="0.35">
    <circle cx="1020" cy="180" r="130" fill="none" stroke="#6366f1" stroke-width="1.5" class="pulse-circle" style="transform-origin: 1020px 180px;" />
    <circle cx="1020" cy="180" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-circle" style="transform-origin: 1020px 180px; animation-delay: -2s;" />
    <circle cx="1020" cy="180" r="40" fill="#38bdf8" fill-opacity="0.15" />
    
    <!-- Flow Beams -->
    <path d="M 600,180 C 750,180 850,110 1020,110" fill="none" stroke="#38bdf8" stroke-width="2" class="signal-beam" />
    <path d="M 600,180 C 750,180 850,250 1020,250" fill="none" stroke="#a855f7" stroke-width="2" class="signal-beam" />
    <path d="M 600,180 L 1020,180" fill="none" stroke="#6366f1" stroke-width="2" class="signal-beam" />
  </g>

  <!-- Audio Waveform Visualizer in Dynamic Section (Right Side) -->
  <g class="wave-line" style="transform-origin: 1020px 180px;">
    <!-- Telephony Voice Wave Bars -->
    <rect x="940" y="165" width="4" height="30" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="952" y="150" width="4" height="60" rx="2" fill="#38bdf8" opacity="0.85"/>
    <rect x="964" y="140" width="4" height="80" rx="2" fill="#6366f1" opacity="0.9"/>
    <rect x="976" y="125" width="4" height="110" rx="2" fill="#818cf8" opacity="0.95"/>
    <rect x="988" y="145" width="4" height="70" rx="2" fill="#a855f7" opacity="0.85"/>
    <rect x="1000" y="160" width="4" height="40" rx="2" fill="#c084fc" opacity="0.8"/>
    <rect x="1012" y="130" width="4" height="100" rx="2" fill="#38bdf8" opacity="0.95"/>
    <rect x="1024" y="115" width="4" height="130" rx="2" fill="#60a5fa" opacity="1" filter="url(#lightGlow)"/>
    <rect x="1036" y="135" width="4" height="90" rx="2" fill="#818cf8" opacity="0.9"/>
    <rect x="1048" y="155" width="4" height="50" rx="2" fill="#c084fc" opacity="0.85"/>
    <rect x="1060" y="140" width="4" height="80" rx="2" fill="#38bdf8" opacity="0.9"/>
    <rect x="1072" y="150" width="4" height="60" rx="2" fill="#6366f1" opacity="0.85"/>
    <rect x="1084" y="165" width="4" height="30" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="1096" y="172" width="4" height="16" rx="2" fill="#94a3b8" opacity="0.7"/>
  </g>

  <!-- Interactive / Floating Telephony Nodes -->
  <g class="orbit-node">
    <!-- CTI Integration Node -->
    <g transform="translate(860, 65)">
      <rect width="130" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#lightGlow)" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" class="badge-text">SIP / VoIP</text>
    </g>
    <!-- WebRTC / AI Node -->
    <g transform="translate(1010, 275)">
      <rect width="140" height="38" rx="19" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" filter="url(#lightGlow)" />
      <circle cx="20" cy="19" r="6" fill="#c084fc" />
      <text x="36" y="24" class="badge-text">AI Agent CTI</text>
    </g>
    <!-- CCaaS Routing Node -->
    <g transform="translate(870, 260)">
      <rect width="125" height="38" rx="19" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#lightGlow)" />
      <circle cx="20" cy="19" r="6" fill="#818cf8" />
      <text x="36" y="24" class="badge-text">WebRTC</text>
    </g>
  </g>

  <!-- Foreground Content: Header, Description & Feature Pills -->
  <g transform="translate(70, 0)">
    <!-- Category Tag -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">TELEPHONY &amp; CCaaS</text>
    </g>

    <!-- Main Title (Strictly Foregrounded & High Contrast) -->
    <text x="0" y="125" class="title-text" filter="url(#glow)">Awesome Contact Center</text>
    <text x="0" y="172" class="title-text" filter="url(#glow)">Voice &amp; CTI</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="215" class="subtitle-text">Curated CCaaS SaaS Platforms, Telephony Engines &amp; Open-Source CTI Systems</text>
    <text x="0" y="240" class="subtitle-text" fill="#64748b" font-size="14.5">Computer Telephony Integration • PBX • SIP Trunking • WebRTC • AI Voice Agents</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="16" y="21" class="badge-text">🎙️ Voice Routing</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="130" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="161" y="21" class="badge-text">⚡ CRM CTI Pops</text>

      <!-- Pill 3 -->
      <rect x="285" y="0" width="125" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="301" y="21" class="badge-text">🌐 Cloud PBX</text>

      <!-- Pill 4 -->
      <rect x="420" y="0" width="150" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <text x="436" y="21" class="badge-text">🤖 Conversational AI</text>
    </g>
  </g>
</svg>
